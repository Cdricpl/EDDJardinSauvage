<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EDD Jardin Sauvage — Gestion</title>
  <link rel="stylesheet" href="css/styles.css?v=v2026.08.20-2" />
  <!-- PWA : installable sur smartphone -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#241d19" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Jardin Sauvage" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <!-- Écran de connexion -->
  <div id="login" class="login-wrap"></div>

  <!-- Application -->
  <div id="appShell" style="display:none">
    <header class="topbar">
      <div class="brand">
        <img src="assets/logo.png" onerror="this.onerror=null;this.src='assets/logo.svg'" alt="Jardin Sauvage" class="logo-header" />
        <span>EDD Jardin Sauvage</span>
        <span id="modeBadge" class="badge"></span>
      </div>
      <span class="version" id="appVersion" title="Version de l'application installée"></span>
      <div>
        <span class="who" id="meName"></span>
        <button class="small gray" id="backupBtn" style="display:none" title="Sauvegarder toutes les données (JSON)" aria-label="Sauvegarder toutes les données">💾</button>
        <button class="small gray" id="logoutBtn">Déconnexion</button>
      </div>
    </header>
    <nav id="nav" class="nav"></nav>
    <main id="app" class="container"></main>
  </div>

  <div id="loadbar"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Bibliothèques externes (mode cloud).
       Chargées via CDN ; l'app fonctionne même si elles manquent (dégradé).
       Firebase doit être présent AVANT store.js, qui teste `window.firebase`
       pour choisir entre le mode cloud et le mode démo : pas de `defer` ici.

       Chart.js et jsPDF (194 Ko compressés) ne sont PAS chargés ici : ils ne
       servent qu'à l'onglet Statistiques et aux boutons « Export PDF ». Les
       charger au démarrage retardait le premier affichage d'environ une
       seconde, pour des bibliothèques que l'on n'ouvre pas à chaque visite.
       app.js les télécharge au moment où elles servent (voir `chargerScript`). -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <!-- Application -->
  <script src="js/config.js?v=v2026.08.20-2"></script>
  <script src="js/store.js?v=v2026.08.20-2"></script>
  <script src="js/app.js?v=v2026.08.20-2"></script>

  <!-- Enregistrement du service worker (installation sur smartphone + hors ligne) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=v2026.08.20-2').catch((e) => console.warn('SW non enregistré', e));
      });
    }
  </script>
</body>
</html>
